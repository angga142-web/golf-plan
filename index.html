<title>Imperial Karawaci Yardage</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: one hole card per swipe, hole strip on top, score dock fixed at the bottom. Single light theme on purpose: read in direct sun. */
:root{
  --paper:#ffffff; --mist:#eef1f5; --ink:#0c162d; --ink2:#46506a; --line:#d3d9e2;
  --gold:#ffc400; --red:#d2142d; --good:#0b7a3a; --over:#b24400;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-num);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.cardbtn{background:var(--gold);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-family:var(--f-num);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:42px;border:2px solid #34405c;border-radius:8px;background:transparent;padding:3px 0 2px;
  display:flex;flex-direction:column;align-items:center;line-height:1;cursor:pointer}
.chip b{font-family:var(--f-num);font-size:19px;font-weight:700}
.chip span{font-family:var(--f-num);font-size:14px;font-weight:700;height:15px;margin-top:2px;color:#9aa6bf}
.chip.on{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.chip.on span{color:var(--ink)}
.chip.ok span{color:#5fe39a}.chip.bad span{color:#ffab7a}
.chip.on.ok span{color:var(--good)}.chip.on.bad span{color:var(--over)}

/* hole slides */
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;justify-content:center;background:var(--paper)}
.slide img{width:100%;max-width:560px;height:auto;aspect-ratio:1/2;display:block}
.spacer{height:calc(132px + env(safe-area-inset-bottom,0px))}

/* score dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:3px solid var(--ink);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dockin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.meta{min-width:0}
.meta .h{font-family:var(--f-num);font-weight:800;font-size:24px;line-height:1}
.meta .p{font-weight:600;color:var(--ink2);font-size:15px;margin-top:2px}
.meta .tot{font-family:var(--f-num);font-weight:700;font-size:18px;margin-top:4px}
.tot .d{padding:1px 6px;border-radius:5px;margin-left:4px;color:#fff;background:var(--ink2)}
.tot .d.ok{background:var(--good)}.tot .d.bad{background:var(--over)}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:56px;height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--mist);font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1;cursor:pointer}
.step:active{background:var(--gold)}
#score{width:68px;height:62px;border:3px solid var(--ink);border-radius:12px;text-align:center;font-family:var(--f-num);font-weight:800;font-size:40px;color:var(--ink);background:#fff;-moz-appearance:textfield}
#score::-webkit-outer-spin-button,#score::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#score.ok{border-color:var(--good);color:var(--good)}#score.bad{border-color:var(--over);color:var(--over)}
.sync{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:600}

/* scorecard sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheetin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sheethead h2{font-family:var(--f-num);font-size:30px;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.close{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.sum small{display:block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sum b{font-family:var(--f-num);font-size:30px;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:16px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
td:first-child,th:first-child{text-align:left}
td.s{font-family:var(--f-num);font-size:21px;font-weight:800}
td.s.ok{color:var(--good)}td.s.bad{color:var(--over)}
tr.sub td{background:var(--mist);font-weight:700}
tr.go{cursor:pointer}
.reset{align-self:flex-start;border:2px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.confirm{border:2px solid var(--red);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1 1 200px;font-weight:600}
.confirm .yes{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.confirm .no{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
/* one-screen summary for a phone screenshot */
.shot{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;gap:10px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.shothead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shothead h2{font-family:var(--f-num);font-size:24px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.03em}
.shothead small{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.shot .sum b{font-size:28px}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.halves table th,.halves table td{padding:5px 2px;font-size:14px}
.halves table th{font-size:11px;letter-spacing:.04em}
.halves td.s{font-size:19px}
.shotfoot{font-size:12px;color:var(--ink2);font-weight:600;display:flex;gap:14px;flex-wrap:wrap}
.shotfoot i{font-style:normal;font-weight:800}
.shotfoot .ok{color:var(--good)}.shotfoot .bad{color:var(--over)}
@media (prefers-reduced-motion:reduce){.slider{scroll-behavior:auto}}
</style>

<header class="top">
  <div class="toprow">
    <div class="brand">Imperial Karawaci · Tee Putih</div>
    <button class="cardbtn" id="openCard" type="button">Kartu skor</button>
  </div>
  <nav class="chips" id="chips" aria-label="Pilih hole"></nav>
</header>

<main class="slider" id="slider" aria-label="Plan per hole"></main>
<div class="spacer"></div>

<section class="dock" aria-label="Input skor">
  <div class="dockin">
    <div class="meta">
      <div class="h" id="mHole">Hole 1</div>
      <div class="p" id="mPar">Par 5 · Target 6 · SI 3</div>
      <div class="tot" id="mTot">Total –</div>
      <div class="sync" id="sync">Tersimpan di HP ini</div>
    </div>
    <div class="stepper">
      <button class="step" id="minus" type="button" aria-label="Kurangi skor">−</button>
      <input id="score" type="number" inputmode="numeric" min="1" max="15" placeholder="–" aria-label="Skor hole ini">
      <button class="step" id="plus" type="button" aria-label="Tambah skor">+</button>
    </div>
  </div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheetin">
    <div class="sheethead"><h2>Kartu skor</h2><button class="close" id="shotBtn" type="button">Satu layar</button><button class="close" id="closeCard" type="button">Tutup</button></div>
    <div class="sum">
      <div><small>Skor</small><b id="sTot">–</b></div>
      <div><small>Target</small><b id="sTgt">87</b></div>
      <div><small>vs Target</small><b id="sVs">–</b></div>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th>Hole</th><th>Par</th><th>SI</th><th>Target</th><th>Skor</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <button class="reset" id="reset" type="button">Mulai ronde baru</button>
    <div class="confirm" id="confirm" hidden>
      <p>Hapus semua skor ronde ini?</p>
      <button class="yes" id="yes" type="button">Ya, hapus</button>
      <button class="no" id="no" type="button">Batal</button>
    </div>
  </div>
</div>

<div class="shot" id="shot" hidden>
  <div class="shothead">
    <div><h2>Imperial Karawaci</h2><small id="shotSub">Tee Putih · Par 72</small></div>
    <button class="close" id="closeShot" type="button">Tutup</button>
  </div>
  <div class="sum">
    <div><small>Skor</small><b id="shTot">–</b></div>
    <div><small>Target</small><b id="shTgt">–</b></div>
    <div><small>vs Target</small><b id="shVs">–</b></div>
  </div>
  <div class="halves">
    <table><thead><tr><th>Out</th><th>Par</th><th>Tgt</th><th>Skor</th></tr></thead><tbody id="shOut"></tbody></table>
    <table><thead><tr><th>In</th><th>Par</th><th>Tgt</th><th>Skor</th></tr></thead><tbody id="shIn"></tbody></table>
  </div>
  <div class="shotfoot" id="shFoot"></div>
</div>

<script>
const HOLES=[ // [par, SI, target, meter putih]
 [4,15,5,293],[4,1,5,327],[4,9,5,326],[4,5,5,300],[3,13,4,115],[5,7,6,425],[3,17,3,91],[4,11,5,294],[5,3,6,441],[4,12,5,292],[5,10,6,414],[4,8,5,324],[4,4,5,331],[3,18,3,129],[4,6,5,350],[3,14,4,137],[4,16,4,310],[5,2,6,501]];
const KEY="ik-round-v1";
let state={scores:{},updated:0}, cur=0, dbRef=null, saveTimer=null, writing=false, again=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.scores) state=s;}catch(e){}

const $=id=>document.getElementById(id);
const slider=$("slider"), chips=$("chips");
HOLES.forEach((h,i)=>{
  const sl=document.createElement("section"); sl.className="slide";
  const im=document.createElement("img"); im.src="img/hole"+(i+1)+".webp"; im.alt="Plan hole "+(i+1)+", par "+h[0];
  im.loading=i<2?"eager":"lazy"; im.width=1080; im.height=2160; sl.appendChild(im); slider.appendChild(sl);
  const c=document.createElement("button"); c.type="button"; c.className="chip"; c.innerHTML="<b>"+(i+1)+"</b><span></span>";
  c.addEventListener("click",()=>go(i,true)); chips.appendChild(c);
});
const cls=(s,t)=>s==null?"":(s<=t?"ok":"bad");
function totals(){let tot=0,tgt=0,n=0;HOLES.forEach((h,i)=>{const s=state.scores[i+1];if(s){tot+=s;tgt+=h[2];n++;}});return{tot,tgt,n};}
function vs(d){return d===0?"±0":(d>0?"+"+d:""+d);}
function render(){
  const h=HOLES[cur], s=state.scores[cur+1];
  $("mHole").textContent="Hole "+(cur+1);
  $("mPar").textContent="Par "+h[0]+" · Target "+h[2]+" · SI "+h[1];
  const inp=$("score"); if(document.activeElement!==inp) inp.value=s??""; inp.className=cls(s,h[2]);
  const t=totals();
  $("mTot").innerHTML=t.n?("Total "+t.tot+" <span class='d "+(t.tot<=t.tgt?"ok":"bad")+"'>"+vs(t.tot-t.tgt)+" target</span> · "+t.n+"/18"):"Total –";
  [...chips.children].forEach((c,i)=>{const v=state.scores[i+1];c.className="chip"+(i===cur?" on":"")+(v?" "+cls(v,HOLES[i][2]):"");c.querySelector("span").textContent=v??"";});
}
function renderCard(){
  const tb=$("tbody"); tb.textContent="";
  const row=(cells,cl,click)=>{const tr=document.createElement("tr");if(cl)tr.className=cl;cells.forEach(([v,c])=>{const td=document.createElement("td");td.textContent=v;if(c)td.className=c;tr.appendChild(td);});if(click){tr.addEventListener("click",click);}tb.appendChild(tr);};
  const part=(a,b,label)=>{let p=0,t=0,s=0,n=0;for(let i=a;i<b;i++){const h=HOLES[i],v=state.scores[i+1];p+=h[0];t+=h[2];if(v){s+=v;n++;}
    row([[""+(i+1)],[""+h[0]],[""+h[1]],[""+h[2]],[v??"–","s "+cls(v,h[2])]],"go",()=>{closeCard();go(i,true);});}
    row([[label],[""+p],[""],[""+t],[n?""+s:"–"]],"sub");};
  part(0,9,"OUT"); part(9,18,"IN");
  const t=totals(); $("sTot").textContent=t.n?t.tot:"–"; $("sVs").textContent=t.n?vs(t.tot-t.tgt):"–";
}
function setScore(v){
  const k=cur+1; if(v==null||isNaN(v)||v<1) delete state.scores[k]; else state.scores[k]=Math.min(15,Math.round(v));
  state.updated=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  render(); queueSync();
}
$("plus").addEventListener("click",()=>{const s=state.scores[cur+1];setScore(s?s+1:HOLES[cur][0]);});
$("minus").addEventListener("click",()=>{const s=state.scores[cur+1];if(s)setScore(s-1);});
$("score").addEventListener("input",e=>{const v=parseInt(e.target.value,10);setScore(isNaN(v)?null:v);});
$("score").addEventListener("blur",render);

function centerChip(i,smooth){const c=chips.children[i];chips.scrollTo({left:c.offsetLeft-(chips.clientWidth-c.offsetWidth)/2,behavior:smooth?"smooth":"auto"});}
function go(i,smooth){cur=i;slider.scrollTo({left:i*slider.clientWidth,behavior:smooth?"smooth":"auto"});render();
  centerChip(i,smooth);
  if(location.hash!=="#h"+(i+1)) history.replaceState(null,"","#h"+(i+1));}
let st=null; slider.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{const i=Math.round(slider.scrollLeft/slider.clientWidth);
  if(i!==cur&&i>=0&&i<18){cur=i;render();centerChip(i,true);history.replaceState(null,"","#h"+(i+1));window.scrollTo({top:0});}},90);},{passive:true});
function fromHash(){const m=/^#h(\d{1,2})$/.exec(location.hash);const i=m?+m[1]-1:0;go(i>=0&&i<18?i:0,false);}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>slider.scrollTo({left:cur*slider.clientWidth}));

function renderShot(){
  const half=(id,a,b)=>{const tb=$(id);tb.textContent="";let p=0,t=0,s=0,n=0;
    const row=(cells,cl)=>{const tr=document.createElement("tr");if(cl)tr.className=cl;cells.forEach(([v,c])=>{const td=document.createElement("td");td.textContent=v;if(c)td.className=c;tr.appendChild(td);});tb.appendChild(tr);};
    for(let i=a;i<b;i++){const h=HOLES[i],v=state.scores[i+1];p+=h[0];t+=h[2];if(v){s+=v;n++;}row([[""+(i+1)],[""+h[0]],[""+h[2]],[v??"–","s "+cls(v,h[2])]]);}
    row([[a?"IN":"OUT"],[""+p],[""+t],[n?""+s:"–"]],"sub");};
  half("shOut",0,9);half("shIn",9,18);
  const t=totals(); $("shTot").textContent=t.n?t.tot:"–"; $("shTgt").textContent=t.n?t.tgt:"–"; $("shVs").textContent=t.n?vs(t.tot-t.tgt):"–";
  let dbl=0,par=0;HOLES.forEach((h,i)=>{const v=state.scores[i+1];if(v){if(v>=h[0]+2)dbl++;if(v<=h[0])par++;}});
  $("shFoot").innerHTML=t.n?("<span>Par atau lebih baik <i class='ok'>"+par+"</i></span><span>Double atau lebih <i class='bad'>"+dbl+"</i></span><span>"+t.n+"/18 hole</span>"):"";
  $("shotSub").textContent="Tee Putih · Par 72 · "+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}
$("shotBtn").addEventListener("click",()=>{renderShot();$("shot").hidden=false;});
$("closeShot").addEventListener("click",()=>{$("shot").hidden=true;});
function openCard(){renderCard();$("sheet").hidden=false;}
function closeCard(){$("sheet").hidden=true;$("confirm").hidden=true;}
$("openCard").addEventListener("click",openCard); $("closeCard").addEventListener("click",closeCard);
$("reset").addEventListener("click",()=>{$("confirm").hidden=false;});
$("no").addEventListener("click",()=>{$("confirm").hidden=true;});
$("yes").addEventListener("click",()=>{state={scores:{},updated:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  $("confirm").hidden=true;renderCard();render();queueSync();});

/* cloud copy of the round (private to the signed-in viewer); the phone copy always works offline */
function queueSync(){if(!dbRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(push,700);}
async function push(){if(writing){again=true;return;}writing=true;$("sync").textContent="Menyimpan…";
  try{await dbRef.set({scores:state.scores,updated:state.updated});$("sync").textContent="Tersimpan di akun kamu";}
  catch(e){$("sync").textContent="Tersimpan di HP ini (offline)";}
  writing=false;if(again){again=false;push();}}
(async()=>{
  try{
    if(!window.claude) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.collection("data/users/"+id).doc("round");
    const snap=await dbRef.get();
    const d=snap.exists?snap.data():null;
    if(d&&d.scores&&(d.updated||0)>(state.updated||0)){state={scores:d.scores,updated:d.updated};try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}render();}
    else if(state.updated) push();
    $("sync").textContent="Tersimpan di akun kamu";
  }catch(e){}
})();
fromHash();
</script>
